repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: detect-private-key
  - repo: local
    hooks:
      - id: no-db-files
        name: No SQLite databases in git
        entry:  scripts/check_no_db.sh
        language: system
        pass_filenames: false