name: deltabalance
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  - pip:
    - flet                # UI desktop
    - flet-charts
    - fastapi             # API futura
    - uvicorn             # servidor FastAPI
    - pydantic            # validación de datos
    - pytest              # tests
    - supabase            # sincronización (sync/)
    - python-dotenv       # credenciales de Supabase desde .env