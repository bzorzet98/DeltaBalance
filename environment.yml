name: deltabalance
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  - pip:
    - flet                # UI desktop
    - flet-charts
    - pytest              # tests
    - keyring
    - openpyxl
    - supabase            # sincronización (sync/)
    - python-dotenv       # credenciales de Supabase desde .env